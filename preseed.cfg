# ndy.onl Thin Client Preseed
# This file automates the Debian installation.

# Localization
d-i debian-installer/locale string de_DE
d-i keyboard-configuration/xkb-keymap select de

# Network
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string thin-client
d-i netcfg/get_domain string local

# Account setup
d-i passwd/root-login boolean true
d-i passwd/root-password password YOUR_SECURE_PASSWORD
d-i passwd/root-password-again password YOUR_SECURE_PASSWORD
d-i passwd/user-fullname string Thin User
d-i passwd/username string thinadmin
d-i passwd/user-password password YOUR_SECURE_PASSWORD
d-i passwd/user-password-again password YOUR_SECURE_PASSWORD

# Partitioning (Warning: This erases the whole disk!)
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# Package selection
tasksel tasksel/first multiselect standard
d-i pkgsel/include string lightdm freerdp2-x11 curl git
d-i pkgsel/upgrade select full-upgrade

# Late Command: This is where the magic happens
# It downloads the setup script from the official ndy.onl repository and runs it.
d-i preseed/late_command string \
    in-target curl -sSL https://raw.githubusercontent.com/ndy-onl/RDP-Thin-Client/main/setup.sh -o /tmp/setup.sh; \
    in-target bash /tmp/setup.sh
